# Fork-only: deploy the selfhost branch to this fork's GitHub Pages as an
# integration preview (https://<owner>.github.io/nezha-docs/). Not contributed
# upstream; upstream pages.yaml is disabled on this fork.
name: Selfhost Pages Preview

on:
  push:
    branches: [selfhost]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project pages are served under /<repo>/; override base on the CLI so
      # the upstream config stays untouched. SEO/MCP audits assume base "/"
      # and run in selfhost-ci.yml instead.
      - name: Build
        run: npx vitepress build docs --base "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
